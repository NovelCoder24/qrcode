<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QRVibe Logo Preview</title>
    <style>
      :root {
        color: #101828;
        background: #f6f8fb;
        font-family: Inter, "Plus Jakarta Sans", Arial, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(1120px, calc(100vw - 48px));
        display: grid;
        gap: 28px;
      }

      .panel {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 34px;
        box-shadow: 0 22px 60px rgba(15, 23, 42, 0.08);
      }

      .dark {
        background: #0f172a;
      }

      .logo-row {
        display: flex;
        align-items: center;
        gap: 48px;
        flex-wrap: wrap;
      }

      .primary {
        width: min(680px, 100%);
        height: auto;
      }

      .mark {
        width: 136px;
        height: 136px;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <div class="logo-row">
          <img class="primary" src="./qrvibe-logo-primary.svg" alt="QRVibe primary logo">
          <img class="mark" src="./qrvibe-logo-mark.svg" alt="QRVibe icon mark">
        </div>
      </section>
      <section class="panel dark">
        <div class="logo-row">
          <img class="primary" src="./qrvibe-logo-primary-light.svg" alt="QRVibe primary logo on dark background">
          <img class="mark" src="./qrvibe-logo-mark.svg" alt="QRVibe icon mark on dark background">
        </div>
      </section>
    </main>
  </body>
</html>
