<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>QRVibe — Dynamic QR Codes with Real-Time Analytics</title>
    <meta name="description" content="Create stylish, dynamic QR codes and track every scan in real-time. QRVibe gives you branded QR codes with live analytics, device breakdowns, and city-level insights — built for modern businesses." />
    <meta name="keywords" content="QR code generator, dynamic QR codes, QR analytics, QR code tracking, branded QR codes, scan analytics, business QR codes" />
    <meta name="author" content="QRVibe" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://qrvibe.in/" />

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/qrvibe-logo-mark.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/qrvibe-logo-mark.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/qrvibe-logo-mark.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://qrvibe.in/" />
    <meta property="og:title" content="QRVibe — Dynamic QR Codes with Real-Time Analytics" />
    <meta property="og:description" content="Create stylish, dynamic QR codes and track every scan in real-time. Branded QR codes with live analytics, device breakdowns, and city-level insights." />
    <meta property="og:image" content="https://qrvibe.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="QRVibe" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://qrvibe.in/" />
    <meta name="twitter:title" content="QRVibe — Dynamic QR Codes with Real-Time Analytics" />
    <meta name="twitter:description" content="Create stylish, dynamic QR codes and track every scan in real-time. Branded QR codes with live analytics, device breakdowns, and city-level insights." />
    <meta name="twitter:image" content="https://qrvibe.in/og-image.png" />

    <!-- Theme Color (matches your brand gradient) -->
    <meta name="theme-color" content="#5B3FF4" />
    <meta name="msapplication-TileColor" content="#5B3FF4" />
    <meta name="msapplication-TileImage" content="/qrvibe-logo-mark.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "QRVibe",
      "url": "https://qrvibe.in",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "Create stylish, dynamic QR codes and track every scan in real-time with city-level analytics.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR"
      },
      "image": "https://qrvibe.in/qrvibe-logo-mark.png",
      "logo": "https://qrvibe.in/qrvibe-logo-mark.png"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
